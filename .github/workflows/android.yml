# Builds the LifeMail Android app (APK) on GitHub's machines and publishes it as a Release.
# Download on the phone from: https://github.com/sumanpresi/SD_Mail/releases/latest
name: Android APK

on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write   # needed only to publish the Release with the APK

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # GitHub's Ubuntu machines already include the Android SDK (ANDROID_HOME).
      - name: Check Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME" || { echo "::error::Android SDK not found on this runner"; exit 1; }
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      # The permanent signing key comes from repository secrets and is never stored in the repo.
      # Without the secrets a temporary key is used (the app works, but Google sign-in and updates
      # need the permanent key — see ANDROID.md).
      - name: Prepare signing key
        env:
          KEYSTORE_B64: ${{ secrets.LIFEMAIL_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.LIFEMAIL_KEYSTORE_PASSWORD }}
        run: |
          KS="$RUNNER_TEMP/lifemail.jks"
          if [ -n "$KEYSTORE_B64" ] && [ -n "$KEYSTORE_PASSWORD" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$KS"
            echo "LIFEMAIL_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "SIGNING=permanent" >> "$GITHUB_ENV"
          else
            PW="temp-$(openssl rand -hex 12)"
            keytool -genkeypair -keystore "$KS" -alias lifemail -keyalg RSA -keysize 2048 -validity 365 \
              -storepass "$PW" -keypass "$PW" -dname "CN=LifeMail temporary" >/dev/null 2>&1
            echo "::add-mask::$PW"
            echo "LIFEMAIL_KEYSTORE_PASSWORD=$PW" >> "$GITHUB_ENV"
            echo "SIGNING=temporary" >> "$GITHUB_ENV"
          fi
          echo "LIFEMAIL_KEYSTORE=$KS" >> "$GITHUB_ENV"

      - name: Build APK
        working-directory: android
        run: |
          set -o pipefail
          gradle assembleRelease --no-daemon --stacktrace 2>&1 | tee "$RUNNER_TEMP/build.log"

      - name: Show build errors
        if: failure()
        run: |
          grep -E "^e: |error:|What went wrong|Could not |Unresolved|FAILURE|> " "$RUNNER_TEMP/build.log" | head -40 | while IFS= read -r l; do echo "::error::${l:0:400}"; done

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          cp "$APK" LifeMail.apk
          FP=$(keytool -list -v -keystore "$LIFEMAIL_KEYSTORE" -alias lifemail -storepass "$LIFEMAIL_KEYSTORE_PASSWORD" 2>/dev/null | grep -E "SHA1:" | head -1 | sed 's/^[[:space:]]*//')
          {
            echo "LifeMail for Android — build ${{ github.run_number }} (commit ${GITHUB_SHA:0:7})"
            echo
            echo "Install: open this page on the phone, tap **LifeMail.apk**, then Install."
            echo
            echo "Signing: **$SIGNING** key. $FP"
            if [ "$SIGNING" = "temporary" ]; then
              echo
              echo "⚠️ Temporary key: Work works, but Personal Google sign-in needs the permanent key secrets (ANDROID.md)."
            fi
          } > notes.md
          gh release create "android-${{ github.run_number }}" LifeMail.apk --title "LifeMail Android ${{ github.run_number }}" --notes-file notes.md --latest
